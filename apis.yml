aid: silna
name: Silna
description: 'Silna Health is a healthcare automation platform that handles prior authorizations,
  benefit checks, eligibility verification, and insurance monitoring upfront so providers
  can confirm patients are clear to receive care. Its Public API (OpenAPI 3.0.2, Bearer-authenticated)
  exposes patients, patient plans, payors, providers, service locations, benefits checks,
  eligibility, prior authorizations, document validation, payor detection, escalations,
  and bulk export across 63 operations, with cursor pagination, idempotency keys, source
  ids, and per-minute rate limiting. Silna is SOC 2 Type II certified (via Vanta) and
  HIPAA compliant, and was surfaced as a portfolio company of Accel and Bain Capital
  Ventures.'
